<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <style>
    :root {
      --page: #dde4eb;
      --body: #26435b;
      --body-shade: #172d40;
      --screen: #132433;
      --screen-ink: #eef4f9;
      --screen-dim: #8fa8bd;
      --screen-error: #ff9d92;
      --key: #f4f6f8;
      --key-ink: #1a2733;
      --fn: #b8c7d5;
      --fn-ink: #1a2733;
      --op: #4e7799;
      --op-ink: #ffffff;
      --eq: #f2b33d;
      --eq-ink: #2b1d03;
      --paper: #ffffff;
      --paper-ink: #2f4255;
      --paper-dim: #6e8193;
      --paper-rule: #e3e9ef;
      --error: #b3261e;
      --hint: #4d6275;
      --focus: #f2b33d;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0e151c;
        --body: #213a4f;
        --body-shade: #12212f;
        --screen: #0b1620;
        --key: #34506a;
        --key-ink: #e8eef3;
        --fn: #4a6782;
        --fn-ink: #e8eef3;
        --op: #7aa3c6;
        --op-ink: #0e1a26;
        --paper: #e6ebef;
        --paper-rule: #cfd8e0;
        --paper-dim: #5d6f80;
        --hint: #8fa3b5;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem 16px;
      background: var(--page);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .calc { width: min(22.5rem, 100%); }

    /* ---------- Paper tape (history) ---------- */
    .tape {
      position: relative;
      z-index: 0;
      width: calc(100% - 3rem);
      margin: 0 auto -1.25rem;
      padding: 0.75rem 1rem 2.1rem;
      background: var(--paper);
      color: var(--paper-ink);
      font-family: "Cascadia Mono", Consolas, "SF Mono", Menlo, ui-monospace, monospace;
      font-size: 0.875rem;
    }

    /* torn top edge */
    .tape::before {
      content: "";
      position: absolute;
      left: 0; right: 0;
      top: -7px;
      height: 7px;
      background: conic-gradient(from 135deg at 50% 0, var(--paper) 90deg, transparent 0) 0 0 / 14px 7px repeat-x;
    }

    .tape__bar {
      display: flex;
      justify-content: flex-end;
      min-height: 1.25rem;
    }

    .tape__clear {
      border: 0;
      padding: 0;
      background: none;
      color: var(--paper-dim);
      font: inherit;
      font-size: 0.75rem;
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
    }
    .tape__clear:hover { color: var(--paper-ink); }

    .tape__list {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 9rem;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .tape__entry {
      display: grid;
      justify-items: end;
      padding: 0.35rem 0;
      border-bottom: 1px dashed var(--paper-rule);
      animation: feed 180ms ease-out;
    }
    .tape__entry:last-child { border-bottom: 0; }

    .tape__expr { color: var(--paper-dim); }
    .tape__result { font-weight: 600; }
    .tape__entry.is-error .tape__result { color: var(--error); }

    .tape__empty {
      margin: 0.25rem 0 0.5rem;
      text-align: center;
      color: var(--paper-dim);
    }

    @keyframes feed {
      from { transform: translateY(0.6rem); opacity: 0; }
    }

    /* ---------- Calculator body ---------- */
    .body {
      position: relative;
      z-index: 1;
      padding: 1.6rem 1.25rem 1.25rem;
      background: var(--body);
      border-radius: 28px;
      box-shadow: 0 18px 40px -18px rgb(10 25 40 / 0.55);
    }

    /* the slot the tape feeds out of */
    .body::before {
      content: "";
      position: absolute;
      top: 0.6rem;
      left: 1.25rem; right: 1.25rem;
      height: 6px;
      border-radius: 3px;
      background: var(--body-shade);
    }

    .display {
      display: block;
      margin-bottom: 1.1rem;
      padding: 0.8rem 1.1rem 0.9rem;
      background: var(--screen);
      border-radius: 16px;
      text-align: right;
    }

    .display__expr {
      min-height: 1.4em;
      color: var(--screen-dim);
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .display__value {
      color: var(--screen-ink);
      font-size: 3rem;
      font-weight: 300;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
    }
    .display__value.is-error { color: var(--screen-error); }

    /* ---------- Keys ---------- */
    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
    }

    .key {
      min-height: 3.5rem;
      border: 0;
      border-radius: 14px;
      background: var(--key);
      color: var(--key-ink);
      font: inherit;
      font-size: 1.4rem;
      box-shadow: 0 3px 0 rgb(0 0 0 / 0.3);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 60ms, box-shadow 60ms;
    }

    .key--fn { background: var(--fn); color: var(--fn-ink); font-size: 1.15rem; }
    .key--op { background: var(--op); color: var(--op-ink); font-size: 1.6rem; }
    .key--eq { background: var(--eq); color: var(--eq-ink); font-size: 1.6rem; }

    /* pending operator stays lit until the next number starts */
    .key--op[aria-pressed="true"] { background: var(--op-ink); color: var(--op); }

    .key:active,
    .key.is-pressed {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgb(0 0 0 / 0.3);
    }

    .key:focus-visible,
    .tape__clear:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .hint {
      margin: 1.25rem 0 0;
      text-align: center;
      color: var(--hint);
      font-size: 0.85rem;
      line-height: 1.5;
    }

    @media (prefers-reduced-motion: reduce) {
      .tape__entry { animation: none; }
      .key { transition: none; }
    }
  </style>
</head>
<body>
  <main class="calc">
    <h1 class="visually-hidden">Calculator</h1>

    <section class="tape" aria-label="Calculation history">
      <div class="tape__bar">
        <button class="tape__clear" id="clear-tape" type="button" hidden>Clear tape</button>
      </div>
      <p class="tape__empty" id="tape-empty">Finished calculations print here.</p>
      <ol class="tape__list" id="tape"></ol>
    </section>

    <div class="body">
      <output class="display" aria-live="polite">
        <div class="display__expr" id="expr"></div>
        <div class="display__value" id="value">0</div>
      </output>

      <div class="keys" id="keys">
        <button class="key key--fn" type="button" data-action="clear"   data-keys="Escape Delete" aria-label="All clear">AC</button>
        <button class="key key--fn" type="button" data-action="back"    data-keys="Backspace"     aria-label="Delete last digit">⌫</button>
        <button class="key key--fn" type="button" data-action="percent" data-keys="%"             aria-label="Percent">%</button>
        <button class="key key--op" type="button" data-action="operator" data-value="÷" data-keys="/"     aria-label="Divide" aria-pressed="false">÷</button>

        <button class="key" type="button" data-action="digit" data-value="7" data-keys="7">7</button>
        <button class="key" type="button" data-action="digit" data-value="8" data-keys="8">8</button>
        <button class="key" type="button" data-action="digit" data-value="9" data-keys="9">9</button>
        <button class="key key--op" type="button" data-action="operator" data-value="×" data-keys="* x X" aria-label="Multiply" aria-pressed="false">×</button>

        <button class="key" type="button" data-action="digit" data-value="4" data-keys="4">4</button>
        <button class="key" type="button" data-action="digit" data-value="5" data-keys="5">5</button>
        <button class="key" type="button" data-action="digit" data-value="6" data-keys="6">6</button>
        <button class="key key--op" type="button" data-action="operator" data-value="−" data-keys="-"     aria-label="Subtract" aria-pressed="false">−</button>

        <button class="key" type="button" data-action="digit" data-value="1" data-keys="1">1</button>
        <button class="key" type="button" data-action="digit" data-value="2" data-keys="2">2</button>
        <button class="key" type="button" data-action="digit" data-value="3" data-keys="3">3</button>
        <button class="key key--op" type="button" data-action="operator" data-value="+" data-keys="+"     aria-label="Add" aria-pressed="false">+</button>

        <button class="key key--fn" type="button" data-action="sign" data-keys="F9" aria-label="Toggle positive or negative">±</button>
        <button class="key" type="button" data-action="digit" data-value="0" data-keys="0">0</button>
        <button class="key" type="button" data-action="digit" data-value="." data-keys=". ," aria-label="Decimal point">.</button>
        <button class="key key--eq" type="button" data-action="equals" data-keys="Enter =" aria-label="Equals">=</button>
      </div>
    </div>

    <p class="hint">You can type with your keyboard too: Enter for =, Backspace to delete, Esc to clear.</p>
  </main>

  <script>
    const MAX_DIGITS = 15;

    const state = {
      current: '0',     // the number on the display, as typed text (ASCII '-', no commas)
      previous: null,   // left-hand number waiting for the pending operator
      operator: null,   // pending operator: '+', '−', '×', '÷'
      overwrite: true,  // true = next digit starts a new number instead of appending
      repeat: null,     // { op, operand } so pressing = again repeats the last step
      error: null,      // message shown instead of a number; cleared by a digit or AC
      expr: ''          // small line above the number, e.g. "12 ×" or "12 × 19 ="
    };

    // Called when the user divides by zero. `a` is the number being divided.
    // Return a number to keep calculating with it, or a string to show it as
    // an error message (the calculator then waits for a new digit or AC).
    function handleDivideByZero(a) {
      return 'Cannot divide by zero';
    }

    function compute(a, op, b) {
      switch (op) {
        case '+': return a + b;
        case '−': return a - b;
        case '×': return a * b;
        case '÷': return b === 0 ? handleDivideByZero(a) : a / b;
      }
    }

    // Number -> display string. Rounds away floating-point noise (0.1 + 0.2)
    // and switches to scientific notation when there are too many digits.
    function formatNumber(n) {
      if (!Number.isFinite(n)) return n > 0 ? 'Infinity' : '-Infinity';
      const rounded = parseFloat(n.toPrecision(12));
      let s = String(rounded);
      if (s.includes('e') || s.replace(/[-.]/g, '').length > MAX_DIGITS) {
        s = rounded.toExponential(8).replace(/\.?0+e/, 'e');
      }
      return s;
    }

    // "1234567.5" -> "1,234,567.5" and "-" -> "−" for display only.
    function prettify(s) {
      if (!/^-?\d+(\.\d*)?$/.test(s)) return s.replace(/-/g, '−');
      const [int, frac] = s.split('.');
      const grouped = int.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      return (frac === undefined ? grouped : grouped + '.' + frac).replace('-', '−');
    }

    // Puts a computed result on the display. Returns false if it became an error.
    function settle(result) {
      if (typeof result === 'string') { showError(result); return false; }
      if (Number.isNaN(result)) { showError('Undefined result'); return false; }
      state.current = formatNumber(result);
      state.overwrite = true;
      return true;
    }

    function showError(message) {
      Object.assign(state, {
        current: '0', previous: null, operator: null,
        overwrite: true, repeat: null, error: message
      });
    }

    function clearAll() {
      Object.assign(state, {
        current: '0', previous: null, operator: null,
        overwrite: true, repeat: null, error: null, expr: ''
      });
    }

    function inputDigit(d) {
      if (state.error) clearAll();
      if (state.overwrite) {
        if (!state.operator) state.expr = '';
        state.current = d === '.' ? '0.' : d;
        state.overwrite = false;
        return;
      }
      if (d === '.' && state.current.includes('.')) return;
      if (state.current.replace(/[-.]/g, '').length >= MAX_DIGITS) return;
      state.current = (state.current === '0' && d !== '.') ? d : state.current + d;
    }

    function chooseOperator(op) {
      if (state.error) return;
      const value = Number(state.current);
      if (state.operator && !state.overwrite) {
        // chaining: 2 + 3 × ... evaluates 2 + 3 first
        if (!settle(compute(state.previous, state.operator, value))) {
          state.expr = '';
          return;
        }
        state.previous = Number(state.current);
      } else if (!state.operator) {
        state.previous = value;
      }
      // pressing a second operator in a row just swaps it
      state.operator = op;
      state.overwrite = true;
      state.repeat = null;
      state.expr = `${prettify(formatNumber(state.previous))} ${op}`;
    }

    function equals() {
      if (state.error) return;
      let a, op, b;
      if (state.operator) {
        a = state.previous; op = state.operator; b = Number(state.current);
      } else if (state.repeat) {
        a = Number(state.current); op = state.repeat.op; b = state.repeat.operand;
      } else {
        return;
      }
      const line = `${prettify(formatNumber(a))} ${op} ${prettify(formatNumber(b))} =`;
      state.operator = null;
      state.previous = null;
      state.expr = line;
      if (!settle(compute(a, op, b))) {
        printTape(line, state.error, true);
        return;
      }
      state.repeat = { op, operand: b };
      printTape(line, prettify(state.current), false);
    }

    function backspace() {
      if (state.error || state.overwrite) return;
      state.current = state.current.slice(0, -1);
      if (state.current === '' || state.current === '-') {
        state.current = '0';
        state.overwrite = true;
      }
    }

    function toggleSign() {
      if (state.error || state.current === '0') return;
      state.current = state.current.startsWith('-') ? state.current.slice(1) : '-' + state.current;
    }

    function percent() {
      if (state.error) return;
      settle(Number(state.current) / 100);
    }

    // ---------- Tape ----------
    const tapeList = document.getElementById('tape');
    const tapeEmpty = document.getElementById('tape-empty');
    const clearTapeBtn = document.getElementById('clear-tape');

    function printTape(exprText, resultText, isError) {
      const li = document.createElement('li');
      li.className = 'tape__entry' + (isError ? ' is-error' : '');
      const expr = document.createElement('span');
      expr.className = 'tape__expr';
      expr.textContent = exprText;
      const result = document.createElement('span');
      result.className = 'tape__result';
      result.textContent = resultText;
      li.append(expr, result);
      tapeList.append(li);
      tapeList.scrollTop = tapeList.scrollHeight;
      tapeEmpty.hidden = true;
      clearTapeBtn.hidden = false;
    }

    clearTapeBtn.addEventListener('click', () => {
      tapeList.replaceChildren();
      tapeEmpty.hidden = false;
      clearTapeBtn.hidden = true;
    });

    // ---------- Rendering ----------
    const valueEl = document.getElementById('value');
    const exprEl = document.getElementById('expr');
    const opButtons = document.querySelectorAll('.key--op');

    function render() {
      valueEl.textContent = state.error ?? prettify(state.current);
      valueEl.classList.toggle('is-error', Boolean(state.error));
      exprEl.textContent = state.expr;

      // shrink the number until it fits
      let size = 3;
      valueEl.style.fontSize = '';
      while (valueEl.scrollWidth > valueEl.clientWidth && size > 1.2) {
        size -= 0.1;
        valueEl.style.fontSize = size + 'rem';
      }

      opButtons.forEach(btn => {
        const lit = state.operator === btn.dataset.value && state.overwrite;
        btn.setAttribute('aria-pressed', String(lit));
      });
    }

    // ---------- Input ----------
    function press(btn) {
      switch (btn.dataset.action) {
        case 'digit':    inputDigit(btn.dataset.value); break;
        case 'operator': chooseOperator(btn.dataset.value); break;
        case 'equals':   equals(); break;
        case 'clear':    clearAll(); break;
        case 'back':     backspace(); break;
        case 'sign':     toggleSign(); break;
        case 'percent':  percent(); break;
      }
      render();
    }

    document.getElementById('keys').addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (btn) press(btn);
    });

    const keyToButton = new Map();
    document.querySelectorAll('[data-keys]').forEach(btn => {
      btn.dataset.keys.split(' ').forEach(k => keyToButton.set(k, btn));
    });

    document.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const btn = keyToButton.get(e.key);
      if (!btn) return;
      e.preventDefault(); // stops Enter double-firing a focused button and "/" opening quick find
      press(btn);
      btn.classList.add('is-pressed');
      setTimeout(() => btn.classList.remove('is-pressed'), 110);
    });

    render();
  </script>
</body>
</html>
